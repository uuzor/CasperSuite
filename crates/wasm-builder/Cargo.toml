[package]
name = "wasm-builder"
version = "0.1.0"
edition = "2021"

[lib]
name = "security_token"

[dependencies]
security-token = { path = "../../modules/security-token" }
odra = { version = "2.8", features = [], default-features = false }
odra-build = { version = "2.8", features = [], default-features = false }

[build-dependencies]
odra-build = { version = "2.8", features = [], default-features = false }

[[bin]]
name = "security_token_build_contract"
path = "src/bin/security_token_build_contract.rs"

[profile.release]
opt-level = "s"
lto = "thin"
