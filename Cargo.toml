# Casper RWA Suite - ERC-3643 Tokenization Project
# ERC-3643-compliant tokenised PE/VC security token suite on Casper Network

[workspace]
resolver = "2"
members = [
    "modules/identity-registry",
    "modules/claim-topics-registry",
    "modules/trusted-issuers-registry",
    "modules/compliance",
    "modules/security-token",
    "modules/fund-token",
    "modules/governance",
    "crates/deployer",
    "crates/build_contract",
    "crates/wasm-builder",
]

[workspace.dependencies]
odra        = { version = "2.8" }
odra-modules = { version = "2.8" }
odra-build  = { version = "2.8" }
odra-test   = { version = "2.8" }
odra-casper-livenet-env = "2.8"
casper-event-standard = "0.7"
casper-types = "6.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto         = true
