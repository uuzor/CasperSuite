# Casper RWA Suite - Agentic RWA Fund
# Casper Fund Contract + Base Treasury (Dinari Integration)

[workspace]
resolver = "2"
members = [
    "modules/fund",
]

[workspace.dependencies]
odra        = { version = "2.8" }
odra-modules = { version = "2.8" }
odra-build  = { version = "2.8" }
odra-test   = { version = "2.8" }
odra-casper-livenet-env = "2.8"
casper-event-standard = "0.7"
casper-types = "6.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto         = true
